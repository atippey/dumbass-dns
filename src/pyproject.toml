[project]
name = "dumbass_dns"
version = "0.0.1"
description = "Route53 dynamic DNS with minimal effort"
authors = [
    {name = "Andrew Tippey",email = "atippey@gmail.com"}
]
requires-python = ">=3.12"
dependencies = [
    "boto3 (>=1.42.6,<2.0.0)",
    "requests (>=2.32.5,<3.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pylint (>=4.0.4,<5.0.0)",
    "awscli (>=1.43.13,<2.0.0)",
]

[tool.poetry.scripts]
refresh = "dumbass_dns.refresh:main"

[tool.poe.tasks]
lint.script = 'pylint dumbass_dns'
